# alembic.ini

[alembic]
# Path to migration scripts
script_location = alembic

# Template for migration file names.
# Includes a timestamp so versions sort chronologically.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(slug)s


# Maximum length of the slug (description) portion of the filename
truncate_slug_length = 40

# Revision environment — leave as default
revision_environment = false

# sys.path modification — leave as default
sourceless = false

# version path separator
version_path_separator = os

# The database URL is intentionally left blank.
# Alembic receives it from app/core/config.py via env.py.
# Do NOT set this value — doing so would duplicate and potentially
# contradict the value in .env.
sqlalchemy.url =

[post_write_hooks]
# No post-write hooks configured

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S 